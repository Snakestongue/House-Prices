<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Housing Predictor</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script type="importmap">{
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }</script>
        <link rel="stylesheet" href="{{ url_for('static', filename='input.css') }}">
<script type="module" src="{{ url_for('static', filename='threeD.js') }}"></script>
    </head>
    <body class="min-h-screen flex items-start md:items-center justify-center pt-6">
        <canvas id="bg"></canvas> <!--Used for the 3d background :)-->

        <div class="w-full max-w-2xl rounded-[10px] py-4 px-6 text-white" id="formBackground">
            <h1 class=" text-[36px] font-extrabold text-center mb-4 
            bg-gradient-to-r from-sky-400 to-blue-600 bg-clip-text text-transparent
            ">AI Housing Predictor</h1>
            <form action="/predict" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-2">
                <div>
                <label>Crime Rate</label>
                <input class="input" type="number"  name="CRIM"placeholder="Enter value">
                </div>

                <div>
                <label>Residential Land</label>
                <input class="input"type="number" name="ZN" placeholder="Enter value">
                </div>

                <div>
                <label>Industrial</label>
                <input class="input" type="number" name="INDUS"placeholder="Enter value">
                </div>

                <div>
                <label>Nitric Oxide</label>
                <input class="input" type="number" name="NOX"placeholder="Enter value">
                </div>

                <div>
                <label>Rooms</label>
                <input class="input" type="number"   name="RM" placeholder="Enter value">
                </div>

                <div>
                <label>Age</label>
                <input class="input" type="number"name="AGE" placeholder="Enter value">
                </div>

                <div>
                <label>Distance </label>
                <input class=" input" type="number" name="DIS" placeholder="Enter value">
                </div>

                <div>
                <label>RAD</label>
                <input class="input " type="number" name="RAD" placeholder="Enter value">
                </div>

                <div>
                <label>Tax</label>
                <input class="input" type=" number" name="TAX" placeholder="Enter value">
                </div>

                <div>
                <label>PTRATIO</label>
                <input class="input" type="number" name="PTRATIO" placeholder="Enter value">
                </div>

                <div>
                <label>B</label>
                <input class="input" type="number" name="B" placeholder=" Enter value">
                </div>

                <div>
                <label>LSTAT</label>
                <input class="input"   type="number" name="LSTAT" placeholder="Enter value">
                </div>
                <div>
                    <label>Charles River</label>
                    <select class="input" name="CHAS">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <button class="md:col-span-2 mt-8 py-4 rounded-[10px] font-bold 
                hover:scale-105 transition
                bg-gradient-to-r from-sky-400 to-blue-600
                ">Predict Price</button>
            </form>
        </div>
    </body>
</html>
