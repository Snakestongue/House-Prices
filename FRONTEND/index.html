<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Housing Predictor</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script type="importmap">{
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }</script>
        <link rel="stylesheet" href="{{url_for('static', filename ='input.css')}}">
        <script type="module" src="{{url_for('static' , filename= 'threeD.js' )}}"></script>
        <link rel="icon" type="image/x-icon" href="/FRONTEND/favicon.png">

    </head>
    <body class="min-h-screen flex items-start md:items-center justify-center pt-6">
        <canvas id="bg"></canvas> <!--Used for the 3d background :)-->

        <div class="w-full max-w-2xl rounded-[10px] py-4 px-6 text-white" id="formBackground">
            <h1 class=" text-[36px] font-extrabold text-center mb-4 
            bg-gradient-to-r from-sky-400 to-blue-600 bg-clip-text text-transparent
            ">AI Housing Predictor</h1>
            <p class="text-center mt-4 mb-6">Used Kaggle's Boston Housing Prices Dataset</p>
            <form action="/predict" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-2">
               <div>
                    <label class="text-white label">Crime Rate (0-2)
                        <span class="i">i</span>
                        <span class="info">CRIM: Per capita crime rate by town. Higher values can mean more crime.</span>
                    </label>
                    <input class="input" type="number" step="any" name="CRIM" placeholder="Enter value" required>
                </div>
                <div>
                    <label class="text-white label">Residential Land Zoned (0-100)
                        <span class="i">i</span>
                        <span class="info">ZN: Proportion of residential land zoned for areas over 25,000 sq ft.</span>
                    </label>
                    <input class="input" type="number" step="any" name="ZN" placeholder="Enter value" required>
                </div>

                <div>
                    <label class="text-white label">Industrial (0-30)
                        <span class="i">i</span>
                        <span class="info">INDUS: Proportion of non-retail business acres per town.</span>
                    </label>
                    <input class="input" type="number" step="any" name="INDUS" placeholder="Enter value" required>
                </div>

                <div>
                    <label class="text-white label">Nitric Oxide (0-1)
                        <span class="i">i</span>
                        <span class="info">NOX: Nitric oxide concentration.</span>
                    </label>
                    <input class="input" type="number" step="any" name="NOX" placeholder="Enter value" required>
                </div>

                <div>
                    <label class="text-white label">Rooms (0-10)
                        <span class="i">i</span>
                        <span class="info">RM: Number of rooms per house.</span>
                    </label>
                    <input class="input" type="number" step="any" name="RM" placeholder="Enter value" required>
                </div>

                <div>
                    <label class="text-white label">Age (0-100)
                        <span class="i">i</span>
                        <span class="info">AGE: Proportion of owner-occupied units built before 1940.</span>
                    </label>
                    <input class="input" type="number" step="any" name="AGE" placeholder="Enter value" required>
                </div>

                <div>
                    <label class="text-white label">Distance (0-15)
                        <span class="i">i</span>
                        <span class="info">DIS: Distance to five Boston employment centers.</span>
                    </label>
                    <input class="input" type="number" step="any" name="DIS" placeholder="Enter value" required>
                </div>

                <div>
                    <label class="text-white label">RAD (0-24)
                        <span class="i">i</span>
                        <span class="info">RAD: Index of accessibility to highways. Higher means easier highway access.</span>
                    </label>
                    <input class="input" type="number" step="any" name="RAD" placeholder="Enter value" required>
                </div>

                <div>
                    <label class="text-white label">Tax (150-800)
                        <span class="i">i</span>
                        <span class="info">TAX: Full property tax rate per $10,000 of value.</span>
                    </label>
                    <input class="input" type="number" step="any" name="TAX" placeholder="Enter value" required>
                </div>

                <div>
                    <label class="text-white label">PTRATIO (15-25)
                        <span class="i">i</span>
                        <span class="info">PTRATIO: Pupil-teacher ratio by town.</span>
                    </label>
                    <input class="input" type="number" step="any" name="PTRATIO" placeholder="Enter value" required>
                </div>

                <div>
                    <label class="text-white label">B (0-400)
                        <span class="i">i</span>
                        <span class="info">B: A statistic derived from the proportion of Black residents by town. <i>It was included in the original dataset and is controversial.</i></span>
                    </label>
                    <input class="input" type="number" step="any" name="B" placeholder="Enter value" required>
                </div>

                <div>
                    <label class="text-white label">LSTAT (1-40)
                        <span class="i">i</span>
                        <span class="info">LSTAT: Percentage of the population considered lower class .</span>
                    </label>
                    <input class="input" type="number" step="any" name="LSTAT" placeholder="Enter value" required>
                </div>
                <div>
                    <label class="text-white label">Charles River
                        <span class="i">i</span>
                        <span class="info">CHAS &mdash; Whether the property borders the Charles River.</span>
                    </label>
                    <select class="input" name="CHAS" required>
                        <option class="bg-gray-800" value="0">No</option>
                        <option class="bg-gray-800" value="1">Yes</option>
                    </select>
                </div>
                <button class="md:col-span-2 mt-8 py-4 rounded-[10px] font-bold 
                hover:scale-105 transition
                bg-gradient-to-r from-sky-400 to-blue-600
                ">Predict Price</button>
            </form>
        </div>
    </body>
</html>
